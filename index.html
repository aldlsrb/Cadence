<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="format-detection" content="telephone=no">
<title>Cadence: Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/*
VOICE: 조용하고 넓은 콘솔 홈 화면. 짧은 문구, 큰 숫자.
IDEA: 게임 콘솔 홈의 타일 줄 — 과목 하나가 게임 하나처럼 나란히 놓인다.
PICTURE: 가로로 흐르는 과목 타일과 끝이 빛나는 얇은 진행 바.
COLOUR and TYPE: 검정/흰색 바탕, 블루 #0070d1 하나로 강조. Inter + Pretendard.
LAYOUT: 아이패드 가로는 왼쪽 세로 메뉴, 세로·폰은 하단 탭바.
*/
:root{
  color-scheme:light dark;
  --bg:#ffffff;--bg2:#f3f5f8;--bg3:#e4e8ee;--card:#f4f6f9;--ink:#0a0a0c;--sub:#8a8f98;
  --line:rgba(10,10,12,.10);--blue:#0070d1;--blue2:#3d9bff;--glow:rgba(0,112,209,.30);
  --pri-bg:#0a0a0c;--pri-ink:#ffffff;--sel:#ffffff;--nav:rgba(255,255,255,.86);
  --f:Inter,"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
html.dark{
  --bg:#0a0a0c;--bg2:#15171c;--bg3:#23262d;--card:#13151a;--ink:#ffffff;
  --line:rgba(255,255,255,.10);--glow:rgba(61,155,255,.45);
  --pri-bg:#ffffff;--pri-ink:#0a0a0c;--nav:rgba(10,10,12,.82);
}
html.dark{color-scheme:dark}
html:not(.dark){color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f);overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

#app{display:flex;min-height:100vh;min-height:100dvh}
#main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) max(5vw,20px) calc(110px + env(safe-area-inset-bottom))}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));background:var(--nav);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nb{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;background:none;border:0;border-radius:16px;color:var(--sub);font-size:12px;font-weight:600}
.nb.on{color:var(--ink)}
.nb.on svg{color:var(--blue2);filter:drop-shadow(0 0 6px var(--glow))}
.nb:focus-visible{outline:none;box-shadow:0 0 0 3px var(--glow)}
@media (min-width:900px) and (orientation:landscape){
  #nav{position:fixed;top:0;bottom:0;left:0;right:auto;height:auto;width:calc(104px + env(safe-area-inset-left));flex-direction:column;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top) + 24px) 12px 24px max(12px,env(safe-area-inset-left));border-top:0;border-right:1px solid var(--line)}
  .nb{flex:none;max-width:none;width:80px;min-height:72px;font-size:13px}
  .nb.on{background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}
  #main{padding-bottom:48px}
  #app{padding-left:calc(104px + env(safe-area-inset-left))}
}
html,body{overscroll-behavior:none}

.view{animation:vin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
h1{font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.025em;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:22px;letter-spacing:-.01em;margin:0 0 14px;font-weight:700}
h3{font-size:20px;margin:0 0 12px}
p{margin:0}
.sub{color:var(--sub)}
.small{font-size:13px}
.eyebrow{color:var(--sub);font-size:15px;font-weight:600;margin-bottom:8px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.vh{margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip svg{width:16px;height:16px;color:var(--blue2)}
.chip.strong{background:var(--blue);color:#fff;box-shadow:0 0 18px -4px var(--blue)}
.quote{margin-top:18px;max-width:640px;font-size:17px;line-height:1.6}
.quote span{display:block;margin-top:4px;color:var(--sub);font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:15px;font-weight:600;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.pill:focus-visible,.day:focus-visible,.opt:focus-visible{outline:none;box-shadow:0 0 0 3px var(--glow)}
.btn.pri{background:var(--pri-bg);color:var(--pri-ink);border-color:transparent}
.btn.pri:hover{box-shadow:0 0 0 4px var(--glow)}
.btn.blue{background:var(--blue);color:#fff;border-color:transparent}
.btn.danger{color:#ff5a5f;border-color:rgba(255,90,95,.4)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.icon{width:44px;padding:0}
.btn.big{min-height:60px;padding:0 40px;font-size:18px}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}

.in{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);padding:0 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
select.in{padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.in:focus{border-color:var(--blue2);box-shadow:0 0 0 3px var(--glow)}
.in.n{width:92px;text-align:right;font-variant-numeric:tabular-nums}
input[type=date].in{min-width:150px}
.ta{width:100%;height:120px;padding:12px 14px;font-size:16px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub);font-weight:600}
.lab.inl{flex-direction:row;align-items:center;gap:8px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field>span{font-size:14px;font-weight:600;color:var(--sub)}
.pill{min-height:44px;min-width:52px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:15px}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 16px -4px var(--blue)}
.tog{display:inline-flex;align-items:center;gap:12px;min-height:44px;font-weight:600;cursor:pointer}
.tog input{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:99px;background:var(--bg3);position:relative;margin:0;transition:background .2s;flex:none}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog input:checked{background:var(--blue)}
.tog input:checked::after{transform:translateX(20px)}
.tog input:focus-visible{box-shadow:0 0 0 3px var(--glow)}

/* 요약 */
.sum{margin:28px 0 6px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sum .big{font-size:clamp(44px,7vw,64px);font-weight:700;line-height:1}
.sum .of{font-size:20px;color:var(--sub);font-weight:600;padding-bottom:6px}
.bar{--c:var(--blue);position:relative;height:6px;border-radius:6px;background:var(--bg3)}
.bar>i{display:block;height:100%;border-radius:inherit;position:relative;background:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar>i::after{content:"";position:absolute;right:0;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px 2px color-mix(in srgb,var(--c) 60%,transparent)}
.bar>i.z::after{display:none}
.bar.lg{height:8px}

/* 타일 */
.tiles{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 max(5vw,20px);padding:34px max(5vw,20px) 56px;margin:-12px calc(-1 * max(5vw,20px)) -26px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tiles::after{content:"";flex:0 0 1px}
.tiles.vert{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;overflow:visible;scroll-snap-type:none;padding:22px 0 26px;margin:0}
.tiles.vert::after{display:none}
.tiles.vert .tile{flex:none;width:auto;scroll-snap-align:none}
.tiles.vert .tile .big{margin:12px 0 10px}
.tiles.vert .tile .big .num{font-size:44px}
.adj{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:14px;margin-top:6px}
.adj .bar{height:8px}
.stepb{width:44px;height:44px;padding:0;border-radius:50%}
.stepb svg{width:20px;height:20px}
.bignum{font:inherit;font-size:52px;font-weight:700;line-height:1;background:none;border:0;padding:0 4px;margin:0 -4px;color:inherit;border-radius:10px;cursor:text}
.bignum:hover{background:color-mix(in srgb,var(--c) 12%,transparent)}
.bignum:focus-visible{outline:none;box-shadow:0 0 0 3px var(--glow)}
.tiles.vert .bignum{font-size:44px}
.bigin{width:130px;height:56px;font-size:36px;font-weight:700;text-align:left;padding:0 12px}
#main{container-type:inline-size}
@container (max-width:900px){.tiles.vert{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:560px){.tiles.vert{grid-template-columns:minmax(0,1fr)}}
@supports not (container-type:inline-size){@media (max-width:1000px){.tiles.vert{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:640px){.tiles.vert{grid-template-columns:minmax(0,1fr)}}}
.tile,.btn,.nb,.pill,.day,.opt,.tile,.btn,.nb,.pill,.day,.opt,.chk .box,.swb,.swc{-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.tile input,.tile textarea{-webkit-user-select:text;user-select:text}
.tiles::-webkit-scrollbar{display:none}
.tile{--c:var(--blue);flex:0 0 min(340px,84vw);scroll-snap-align:start;background:var(--card);border-radius:24px;padding:22px;border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s;position:relative;cursor:pointer}
.tile::before{content:"";position:absolute;inset:0;border-radius:22px;background:radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%);pointer-events:none}
.tile.sel{transform:scale(1.02);border-color:var(--sel);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent),0 0 22px -2px color-mix(in srgb,var(--c) 55%,transparent),0 8px 28px -10px color-mix(in srgb,var(--c) 60%,transparent)}
html:not(.dark) .tile.sel{border-color:#fff;box-shadow:0 0 0 2px var(--c),0 0 20px -4px color-mix(in srgb,var(--c) 55%,transparent),0 8px 24px -10px color-mix(in srgb,var(--c) 55%,transparent)}
.tile header{display:flex;align-items:center;gap:10px;position:relative}
.tile header b{font-size:19px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none;display:inline-block}
.tile .meta{position:relative;margin-top:4px;font-size:13px;color:var(--sub)}
.tile .big{position:relative;display:flex;align-items:baseline;gap:8px;margin:18px 0 14px}
.tile .big .num{font-size:52px;font-weight:700;line-height:1}
.tile .big .of{color:var(--sub);font-weight:600;font-size:17px}
.tile .state{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--blue2);margin-bottom:10px}
.tile .state svg{width:16px;height:16px}
.panel{margin-top:26px;padding:24px;border-radius:24px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}
.panel.rest{display:grid;gap:14px;background:radial-gradient(90% 120% at 100% 0%,color-mix(in srgb,var(--blue) 18%,transparent),transparent 60%),var(--bg2)}
.panel.rest .ttl{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:700}
.panel.rest .ttl svg{width:30px;height:30px;color:var(--blue2)}
.list{display:grid;gap:10px;margin-top:6px}
.li{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.li b{font-weight:600}
.warn{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:18px;margin:0 0 20px;background:color-mix(in srgb,#ff5a5f 10%,var(--bg2));box-shadow:inset 0 0 0 1px rgba(255,90,95,.35);font-size:15px}
.warn ul{margin:0;padding-left:18px}
.undo{margin-left:auto}

/* 체크리스트 */
.chk{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 4px;border-bottom:1px solid var(--line)}
.chk button.box{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--sub);background:transparent;display:grid;place-items:center;flex:none}
.chk button.box svg{width:18px;height:18px;opacity:0}
.chk.done button.box{background:var(--blue);border-color:var(--blue);color:#fff}
.chk.done button.box svg{opacity:1}
.chk.done span{color:var(--sub);text-decoration:line-through}
.chk span{flex:1}

/* 진도 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:30px}
.stat{padding:18px 20px;border-radius:20px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:13px;color:var(--sub);font-weight:600}
.sec{margin-top:34px}
.sec>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec>header h2{margin:0}
.prow{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.prow .nm{display:flex;align-items:center;gap:10px;font-weight:600;overflow:hidden}
.prow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .vals{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.prow .vals small{display:block;color:var(--sub);font-weight:500;font-size:13px}
.fc{grid-column:2/-1;font-size:13px;margin-top:-6px;color:var(--sub)}
.fc b{color:var(--ink);font-weight:600}
.fc b.late{color:#ff5a5f}
.fc b.ok{color:var(--blue2)}
@media (max-width:600px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .bar{grid-column:1/-1;grid-row:2}.fc{grid-column:1/-1;margin-top:0}}
.dcard{--c:var(--blue);padding:20px;border-radius:22px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:14px}
.dcard header{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:14px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:18px}
.mini div b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini div span{font-size:13px;color:var(--sub)}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.col i{display:block;width:100%;max-width:26px;min-height:3px;border-radius:6px 6px 3px 3px;background:var(--c)}
.col.rest i{background:var(--bg3)}
.col.full i{box-shadow:0 0 12px -2px var(--c)}
.col span{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
@media (max-width:520px){.col span{font-size:0}.col:nth-child(7n+1) span,.col:last-child span{font-size:12px}}

/* 캘린더 */
.calh{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.calh h2{margin:0 8px 0 0;font-size:26px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{text-align:center;font-size:13px;color:var(--sub);font-weight:600;padding-bottom:4px}
.day{position:relative;min-height:clamp(54px,9vw,92px);border-radius:14px;border:0;background:var(--bg2);padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-variant-numeric:tabular-nums}
.day .dn{font-weight:600;font-size:15px}
.day .tag{position:absolute;top:8px;right:8px;font-size:12px;color:var(--sub)}
.day .tagi{top:6px;right:6px;line-height:0}
.day .tagi svg{width:12px;height:12px}
.day.ok .tag{color:#fff}
@media (max-width:600px){.day .tag{top:4px;right:4px;font-size:11px}.day .tagi svg{width:10px;height:10px}}
.day .dots{display:flex;gap:3px;flex-wrap:wrap}
.day .dots i{width:7px;height:7px;border-radius:50%}
.day .dots i.h{background:transparent}
.day.ok .dots i.h{box-shadow:inset 0 0 0 1.5px #fff!important}
.pill.sm2{min-width:44px;padding:0 10px}
.btn:disabled{opacity:.35;pointer-events:none}
.memob{position:relative;min-height:36px;padding:0 12px;font-size:13px;color:var(--sub)}
.memob svg{width:15px;height:15px}
.tile .memo{position:relative;margin-top:10px;font-size:14px;color:var(--ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;border-left:2px solid var(--c)}
.mta{flex-basis:100%;height:auto;min-height:44px;padding:11px 14px;resize:vertical;font-family:var(--f);line-height:1.45}
.mm{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mm span{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums;padding-top:2px}
.mm p{white-space:pre-wrap;overflow-wrap:anywhere}
.panel.todo{margin-top:22px;padding:18px 22px}
.panel.todo>header{justify-content:space-between}
.chk small{font-size:12px}
.day .tdm{margin-left:auto;display:inline-grid;place-items:center;color:var(--sub)}
.day .tdm svg{width:14px;height:14px}
.day .tdm.ok{color:var(--blue2)}
.day.ok .tdm{color:#fff}
.day .dots{align-items:center}
.mhd{font-size:15px;color:var(--sub);margin:22px 0 6px;font-weight:600}
.mitem{--c:var(--blue);display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;width:calc(100% + 24px);text-align:left;padding:14px 12px;margin:0 -12px;border:0;border-radius:16px;background:transparent;border-bottom:1px solid var(--line)}
.mitem:hover,.mitem:focus-visible{background:var(--bg2);outline:none}
.mdate{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
.mdate small{display:block;color:var(--sub);font-size:12px;font-weight:500}
.mbody{display:grid;gap:4px}

function rangeOf(p,s,t){
 if(s.from===''||s.from==null)return null;const f=+s.from;if(!(f>=0))return null;
 const g=goal(p,s,t);if(g<=0)return null;
 let before,cap=Infinity;
 if(s.mode==='total'){const ri=roundAt(p,t);if(ri<0)return null;const r=p.rounds[ri];before=sumLog(p,s.id,r.s,addD(t,-1));cap=f+roundAmt(p,s,ri)-1}
 else before=sumLog(p,s.id,'0000-00-00',addD(t,-1));
 const a=f+before;if(a>cap)return null;const b=Math.min(cap,a+g-1),nx=a+doneOn(p,t,s.id);
 return{a,b,nx:nx<=b?nx:null};
}

function weekData(p,off){
 const t=todayStr(),mon=addD(t,-((dowOf(t)+6)%7)+off*7),days=[...Array(7)].map((_,i)=>addD(mon,i));
 let total=0,ok=0,study=0;const per={};p.subjects.forEach(s=>per[s.id]=0);
 const daily=days.map(ds=>{let n=0;p.subjects.forEach(s=>{const v=doneOn(p,ds,s.id);n+=v;per[s.id]+=v});total+=n;const st=dayStat(p,ds);if(ds<=t&&!['rest','none','out','future'].includes(st)){study++;if(st==='ok')ok++}return{ds,n,st}});
 return{mon,sun:days[6],days:daily,total,ok,study,per};
}

function carryTodos(p){
 if(p.todoCarry===false)return false;const t=todayStr();let moved=false;
 for(const ds of Object.keys(p.todos).sort()){
  if(ds>=t)continue;const left=(p.todos[ds]||[]).filter(x=>!x.done);if(!left.length)continue;
  p.todos[ds]=p.todos[ds].filter(x=>x.done);if(!p.todos[ds].length)delete p.todos[ds];
  p.todos[t]=[...left.map(x=>Object.assign(x,{from:x.from||ds})),...(p.todos[t]||[])];moved=true;
 }
 return moved;
}

function newSubj(p,mode){return{id:uid(),name:'',mode,total:'',daily:'',byDow:null,carry:false,ci:p.nextCi++}}

 if(st===1)b=`<h1>목표와 기간</h1><p class="lead">시험이나 목표의 이름과 날짜를 정합니다.</p>
  <label class="field"><span>목표 이름</span><input class="in" placeholder="예: 토익 900, 기말고사" value="${esc(p.name)}" data-ch="name"></label>
  <div class="row"><label class="lab">시작일<input class="in" type="date" value="${esc(p.start)}" data-ch="start"></label><label class="lab">마감일${p.kind==='daily'?' (선택)':''}<input class="in" type="date" value="${esc(p.deadline)}" data-ch="deadline"></label></div>`;

 if(st===3)b=`<h1>과목</h1><p class="lead">${p.kind==='total'?'과목별 총 분량을 넣으세요.':p.kind==='daily'?'과목별 하루 목표를 넣으세요.':'과목마다 방식을 고르고 분량을 넣으세요.'}</p>${subjEditor(p,p.kind==='mixed')}`;
 if(st===4)b=`<h1>과목 배치</h1><p class="lead">하루에 어떤 과목을 할지 정합니다. 나중에 설정에서 바꿀 수 있습니다.</p>${schedEditor(p)}`;
 if(st===5)b=`<h1>회독</h1><p class="lead">총 분량 과목을 몇 번 돌릴지 정합니다. 날짜는 직접 고칠 수 있습니다.</p>${roundEditor(p)}`;

function wizCheck(p,st){
 if(st===1){if(!p.name.trim())return '목표 이름을 입력하세요.';if(!validDate(p.start))return '시작일을 입력하세요.';if(p.kind!=='daily'&&!validDate(p.deadline))return '마감일을 입력하세요.';if(validDate(p.deadline)&&p.deadline<p.start)return '마감일이 시작일보다 앞입니다.'}
 if(st===2&&!String(p.unit).trim())return '단위를 정하세요.';
 if(st===3){
  if(!p.subjects.some(s=>s.name.trim()))return '과목을 하나 이상 입력하세요.';
  for(const s of p.subjects.filter(s=>s.name.trim())){
   if(s.mode==='total'&&!(+s.total>0))return `${s.name}: 총 분량을 입력하세요.`;
   if(s.mode!=='total'&&!(+s.daily>0)&&!(s.byDow&&s.byDow.some(v=>+v>0)))return `${s.name}: 하루 목표를 입력하세요.`;
   if(s.mode==='total'&&!validDate(p.deadline))return '총 분량 과목에는 마감일이 필요합니다. 이전 단계에서 마감일을 넣으세요.';
  }
 }
 if(st===5){const e=roundErrs(p);if(e.length)return e[0]}
 if(st===6){const e=validatePlan(p);if(e.length)return e[0]}
 return '';
}

/* ---------- 기록 변경 ---------- */
function snap(p,ds){memo.clear();const o={};p.subjects.forEach(s=>{const ri=s.mode==='total'?roundAt(p,ds):-1;o[s.id]={g:goal(p,s,ds),d:doneOn(p,ds,s.id),ri,rd:ri>=0?sumLog(p,s.id,p.rounds[ri].s,p.rounds[ri].e):0,amt:ri>=0?roundAmt(p,s,ri):0}});return o}
function change(sid,fn){
 const p=plan(),t=todayStr();if(!p)return;
 const before=snap(p,t);
 const prev=ent(p,t,sid);V.undo={pid:p.id,ds:t,sid,prev:prev?Object.assign({},prev):null};
 p.log[t]=p.log[t]||{};const e=p.log[t][sid]=Object.assign({d:0,o:0,t:0,x:0},p.log[t][sid]);
 fn(e);['d','o','t','x'].forEach(k=>e[k]=Math.max(0,Math.round(+e[k]||0)));
 cleanLog(p,t);save();
 const after=snap(p,t);celebrate(p,before,after);save();
 V.sel=sid;render({keep:true});
}
const TIER={plat:['플래티넘','linear-gradient(135deg,#9aa3ae,#f4f6f8 45%,#c9d0d8 60%,#ffffff)','#0a0a0c'],gold:['골드','linear-gradient(135deg,#a8791e,#f1cf6b 55%,#c99a32)','#2a1d00'],silver:['실버','linear-gradient(135deg,#7d8590,#e3e7ec 55%,#a3aab3)','#15181c'],bronze:['브론즈','linear-gradient(135deg,#7a4a26,#dba174 55%,#a8693d)','#ffffff']};
const ticHTML=(k,cls)=>`<span class="tic ${cls||''}" style="background:${TIER[k][1]};color:${TIER[k][2]}">${I.trophy}</span>`;
const trow=x=>`<div class="trow">${ticHTML(x.tier,'sm')}<div class="grow"><b>${esc(x.title)}</b><span class="sub small">${TIER[x.tier][0]}${x.sub?' · '+esc(x.sub):''}</span></div><span class="sub small num">${fmtMD(x.ds)}</span></div>`;
/* 트로피: 과목 배치 방식과 상관없이 '그날 목표를 다 채운 날' 기준으로만 계산 */
const MIL_STREAK=[[3,'bronze'],[7,'silver'],[14,'gold'],[30,'plat']];
const MIL_TOTAL=[[7,'bronze'],[15,'silver'],[30,'gold'],[60,'plat']];
const TORD={bronze:1,silver:2,gold:3,plat:4};
function syncTrophies(p,notify){
 const t=todayStr();if(!validDate(p.start)||p.start>t)return;
 memo.clear();
 const add=(k,tier,title,ds)=>{if(p.trophies.some(x=>x.k===k))return;p.trophies.push({k,tier,title,sub:'',ds,ts:(ds===t&&notify)?Date.now():dnum(ds)*864e5+TORD[tier]});if(notify&&ds===t)toast(title,p.name,tier)};
 let run=0,tot=0;
 for(let d=p.start,g=0;d<=t&&g<3000;d=addD(d,1),g++){
  const st=dayStat(p,d);
  if(st==='out')break;
  if(st==='rest'||st==='none')continue;
  if(st==='ok'){run++;tot++;add('day-'+d,'bronze','오늘 목표 달성',d);
   MIL_STREAK.forEach(([n,tr])=>{if(run===n)add(`streak-${n}-${d}`,tr,`${n}일 연속 달성`,d)});
   MIL_TOTAL.forEach(([n,tr])=>{if(tot===n)add(`total-${n}-`,tr,`누적 ${n}일 달성`,d)});
  }else if(d<t)run=0;
 }
 for(const ds of Object.keys(p.todos)){if(ds>=t)continue;const L=p.todos[ds]||[];if(L.length&&L.every(x=>x.done))add('todo-'+ds,'bronze','To-Do List 모두 완료',ds)}
 {const C=todayTodos(p,t);if(C.n&&C.d===C.n)add('todo-'+t,'bronze','To-Do List 모두 완료',t)}
}
function celebrate(p,b,a){
 p.subjects.forEach(s=>{const x=b[s.id],y=a[s.id];if(!x||!y)return;

/* ---------- 입력 반영 ---------- */
function apply(el,commit){
 const p=tp(),k=el.dataset.ch;
 if(k==='quote'){S.opt.quote=el.checked;save();return}
 if(!p)return;
 const v=el.type==='checkbox'?el.checked:el.value,s=el.dataset.id?p.subjects.find(x=>x.id===el.dataset.id):null,i=+el.dataset.i;
 const int=x=>x===''?'':Math.max(0,parseInt(x)||0);
 let rr=false;
 switch(k){
  case 'name':p.name=v;break;
  case 'start':if(validDate(v)){p.start=v;if(commit)autoR(p);rr=true}break;
  case 'deadline':p.deadline=validDate(v)?v:'';if(commit)autoR(p);rr=true;break;
  case 'unitc':p.unit=v.trim();break;
  case 'sname':if(s)s.name=v;break;
  case 'smode':if(s){s.mode=v;if(v==='total'&&!p.rounds.length){p.roundsAuto=true;suggestRounds(p,1)}rr=true}break;
  case 'stotal':if(s)s.total=int(v);break;
  case 'sdaily':if(s)s.daily=int(v);break;
  case 'sfrom':if(s)s.from=int(v);break;
  case 'sdow':if(s&&s.byDow)s.byDow[i]=int(v);break;
  case 'scarry':if(s)s.carry=v==='1';rr=true;break;
  case 'rs':case 're':if(p.rounds[i]&&validDate(v)){p.rounds[i][k==='rs'?'s':'e']=v;p.roundsAuto=false;rr=true}break;
  case 'rcount':p.roundsAuto=true;suggestRounds(p,+v);rr=true;break;
  case 'fon':p.finish.on=!!v;if(p.roundsAuto)suggestRounds(p,p.rounds.length||1);else syncFinish(p);rr=true;break;
  case 'fdays':p.finish.days=Math.max(1,parseInt(v)||1);if(commit){if(p.roundsAuto)suggestRounds(p,p.rounds.length||1);else syncFinish(p);rr=true}break;
  case 'tdc':p.todoCarry=!!v;rr=true;break;
 }
 if(!V.wiz)save();
 if(commit&&rr)render({keep:true});
}

 H.e.d=Math.max(0,H.e.d+H.n);const tile=H.b.closest('.tile');if(tile){const nb=tile.querySelector('.bignum');if(nb)nb.textContent=fmt(H.e.d);const bi=tile.querySelector('.bar>i');if(bi){const pc=H.g?Math.min(100,H.e.d/H.g*100):(H.e.d?100:0);bi.style.width=pc+'%';bi.classList.toggle('z',!pc)}}}
function holdEnd(){const H=HOLD;if(!H)return;clearTimeout(H.to);clearInterval(H.iv);HOLD=null;if(!H.active)return;NOCLICK=Date.now();
 const p=plan(),t=H.ds;cleanLog(p,t);save();const after=snap(p,t);celebrate(p,H.before,after);save();V.sel=H.id;render({keep:true})}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.stepb');if(!b)return;holdEnd();
 const id=b.dataset.id,n=+b.dataset.n;try{b.setPointerCapture(e.pointerId)}catch(_){}
 HOLD={b,id,n,t0:Date.now(),active:false,to:setTimeout(()=>{const p=plan(),t=todayStr(),s=p&&p.subjects.find(x=>x.id===id);if(!s||!HOLD)return;
  HOLD.before=snap(p,t);const prev=ent(p,t,id);V.undo={pid:p.id,ds:t,sid:id,prev:prev?Object.assign({},prev):null};
  p.log[t]=p.log[t]||{};HOLD.e=p.log[t][id]=Object.assign({d:0,o:0,t:0,x:0},p.log[t][id]);HOLD.g=goal(p,s,t);HOLD.ds=t;HOLD.active=true;holdTick();HOLD.iv=setInterval(holdTick,90)},450)};
});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>document.addEventListener(ev,()=>holdEnd(),true));
window.addEventListener('blur',()=>holdEnd());
document.addEventListener('visibilitychange',()=>{if(document.hidden)holdEnd()});
/* 확대·축소 막기 (iOS Safari는 viewport 설정을 무시할 때가 있어 제스처도 막음) */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.scale!==undefined&&e.scale!==1)e.preventDefault()},{passive:false});
/* 가로 스크롤: 마우스 휠·드래그 */
document.addEventListener('wheel',e=>{const t=e.target.closest&&e.target.closest('.tiles:not(.vert)');if(!t||e.ctrlKey)return;if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;const max=t.scrollWidth-t.clientWidth;if(max<=0)return;const nx=t.scrollLeft+e.deltaY;if((e.deltaY<0&&t.scrollLeft<=0)||(e.deltaY>0&&t.scrollLeft>=max-1))return;e.preventDefault();t.scrollLeft=Math.max(0,Math.min(max,nx))},{passive:false});
let DR=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;const t=e.target.closest('.tiles:not(.vert)');if(!t||e.target.closest('button,input,textarea,select,.memo'))return;DR={t,x:e.clientX,l:t.scrollLeft,moved:false}});
document.addEventListener('pointermove',e=>{if(!DR)return;const dx=e.clientX-DR.x;if(!DR.moved&&Math.abs(dx)>5){DR.moved=true;DR.t.classList.add('drag')}if(DR.moved)DR.t.scrollLeft=DR.l-dx});
document.addEventListener('pointerup',()=>{if(!DR)return;const d=DR;DR=null;if(d.moved){d.t.classList.remove('drag');const c=d.t.querySelector('.tile');if(c){const w=c.getBoundingClientRect().width+18;d.t.scrollTo({left:Math.round(d.t.scrollLeft/w)*w,behavior:'smooth'})}const block=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener('click',block,{capture:true,once:true});setTimeout(()=>document.removeEventListener('click',block,{capture:true}),50)}});

/* ---------- 테마 · 날짜 넘김 ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const th=document.documentElement.dataset.theme,o=S.opt.theme||'auto';dark=o==='dark'?true:o==='light'?false:(th==='dark'||(th!=='light'&&mq.matches));document.documentElement.classList.toggle('dark',dark);$$('meta[name=theme-color]').forEach(m=>m.setAttribute('content',o==='auto'?((m.getAttribute('media')||'').includes('dark')?'#0a0a0c':'#ffffff'):(dark?'#0a0a0c':'#ffffff')))}
try{mq.addEventListener('change',()=>{applyTheme();render({keep:true})})}catch(e){try{mq.addListener(()=>{applyTheme();render({keep:true})})}catch(_){}}
const themeObs=new MutationObserver(()=>{applyTheme();render({keep:true})});
themeObs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let lastDay=todayStr();
const dayCheck=()=>{const t=todayStr();if(t!==lastDay){lastDay=t;V.undo=null;V.sel=null;if(!V.wiz&&!$('#modal').innerHTML)render()}};
setInterval(dayCheck,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayCheck()});

/* 홈 화면 아이콘: 흰 바탕 + 파란 링 C + 끝점 */
function drawIcon(S0){const c=document.createElement('canvas');c.width=c.height=S0;const x=c.getContext('2d');const k=S0/80,cx=40*k,cy=40*k,r=22*k,a=40*Math.PI/180;
 x.fillStyle='#ffffff';x.fillRect(0,0,S0,S0);
 x.strokeStyle='#0070d1';x.lineWidth=9*k;x.lineCap='round';x.beginPath();x.arc(cx,cy,r,-a,a,true);x.stroke();
 x.fillStyle='#0a0a0c';x.beginPath();x.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),5*k,0,Math.PI*2);x.fill();return c}
try{const u=drawIcon(512).toDataURL('image/png');[['apple-touch-icon',''],['icon','512x512']].forEach(([r,sz])=>{const l=document.createElement('link');l.rel=r;if(sz)l.sizes=sz;l.href=u;document.head.appendChild(l)})}catch(e){}

load();applyTheme();if(S.plans.length&&!S.plans.find(p=>p.id===S.active))S.active=S.plans[0].id;render();
}
